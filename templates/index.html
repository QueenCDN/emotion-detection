<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detection</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let RunSentimentAnalysis = () => {
            let textToAnalyze = document.getElementById("textToAnalyze").value;
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("system_response").innerHTML = xhttp.responseText;
                }
            };
            xhttp.open("GET", "emotionDetector?textToAnalyze=" + textToAnalyze, true);
            xhttp.send();
        };
    </script>
</head>
<body>
    <h1 style="text-align:center; color:#0f62fe;">Emotion Detection</h1>
    <div style="text-align:center;">
        <textarea id="textToAnalyze" rows="4" cols="50"></textarea><br><br>
        <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <p id="system_response"></p>
    </div>
</body>
</html>
